name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*-dev.txt') }}

      - name: Install test deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements-dev.txt

      - name: Install project deps
        run: |
          pip install -q -r gateway/requirements.txt
          pip install -q -r worker/requirements.txt

      - name: Lint (gateway)
        run: |
          pip install -q ruff
          ruff check gateway/app/backend/main.py || echo "lint warnings (gateway)"
          ruff format --check gateway/app/backend/main.py || echo "format issues (gateway)"

      - name: Lint (worker)
        run: |
          ruff check worker/app/backend/main.py || echo "lint warnings (worker)"
          ruff format --check worker/app/backend/main.py || echo "format issues (worker)"

      - name: Run tests
        run: |
          python -m pytest tests/unit -v --cov=cpu_limit --cov=gpu_detector --cov=media_probe --cov-report=term-missing || true
